<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Brown Football TV</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .screen {
      width: 100vw;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #4E3629;
      color: white;

      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 7vw;
      margin: 0;
    }

    p {
      font-size: 2.5vw;
    }
  </style>
</head>

<body>

  <div class="screen">
    <div>
      <h1>BROWN FOOTBALL</h1>
      <p>TV DISPLAY IS WORKING</p>
    </div>
  </div>

</body>
</html>
