<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Brown Football TV</title>

<style>

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  background: black;

  overflow: hidden;
}

#player {
  width: 100vw;
  height: 100vh;

  background: black;

  overflow: hidden;
}

.visual {
  width: 100%;
  height: 100%;

  object-fit: contain;

  background: black;
}

iframe {
  width: 100vw;
  height: 100vh;

  border: 0;
}

#message {
  color: white;

  font-family:
    Arial,
    sans-serif;

  font-size: 3vw;

  text-align: center;

  padding-top: 40vh;
}


/* AUDIO START */

#audioStart {
  position: fixed;

  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  background:
    rgba(0,0,0,.82);

  z-index: 9999;
}

#audioStart button {
  padding:
    28px 42px;

  font-size:
    26px;

  font-weight:
    bold;

  border: 0;

  border-radius:
    10px;

  cursor:
    pointer;
}


/* FADE */

.enter-fade {
  animation:
    fadeIn .8s ease;
}

.exit-fade {
  animation:
    fadeOut .8s ease forwards;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes fadeOut {
  from { opacity: 1; }
  to { opacity: 0; }
}


/* SLIDE LEFT */

.enter-slideLeft {
  animation:
    slideLeftIn .8s ease;
}

.exit-slideLeft {
  animation:
    slideLeftOut .8s ease forwards;
}

@keyframes slideLeftIn {

  from {
    transform:
      translateX(100%);

    opacity: 0;
  }

  to {
    transform:
      translateX(0);

    opacity: 1;
  }

}

@keyframes slideLeftOut {

  from {
    transform:
      translateX(0);

    opacity: 1;
  }

  to {
    transform:
      translateX(-100%);

    opacity: 0;
  }

}


/* SLIDE RIGHT */

.enter-slideRight {
  animation:
    slideRightIn .8s ease;
}

.exit-slideRight {
  animation:
    slideRightOut .8s ease forwards;
}

@keyframes slideRightIn {

  from {
    transform:
      translateX(-100%);

    opacity: 0;
  }

  to {
    transform:
      translateX(0);

    opacity: 1;
  }

}

@keyframes slideRightOut {

  from {
    transform:
      translateX(0);

    opacity: 1;
  }

  to {
    transform:
      translateX(100%);

    opacity: 0;
  }

}


/* ZOOM */

.enter-zoomIn {
  animation:
    zoomIn .8s ease;
}

.enter-zoomOut {
  animation:
    zoomOut .8s ease;
}

.exit-zoomIn,
.exit-zoomOut {
  animation:
    fadeOut .8s ease forwards;
}

@keyframes zoomIn {

  from {
    transform:
      scale(.85);

    opacity: 0;
  }

  to {
    transform:
      scale(1);

    opacity: 1;
  }

}

@keyframes zoomOut {

  from {
    transform:
      scale(1.15);

    opacity: 0;
  }

  to {
    transform:
      scale(1);

    opacity: 1;
  }

}


/* BLUR */

.enter-blur {
  animation:
    blurIn .8s ease;
}

.exit-blur {
  animation:
    blurOut .8s ease forwards;
}

@keyframes blurIn {

  from {
    filter:
      blur(18px);

    opacity: 0;
  }

  to {
    filter:
      blur(0);

    opacity: 1;
  }

}

@keyframes blurOut {

  from {
    filter:
      blur(0);

    opacity: 1;
  }

  to {
    filter:
      blur(18px);

    opacity: 0;
  }

}

</style>
</head>

<body>


<div id="player">

  <div id="message">
    Loading TV Display...
  </div>

</div>


<audio
  id="backgroundAudio">
</audio>


<div id="audioStart">

  <button id="audioStartButton">
    START DISPLAY WITH AUDIO
  </button>

</div>


<script>

const MEDIA_FOLDER =
  "media";


// ---------------------------------------------
// UPDATE SPEEDS
// ---------------------------------------------

// Fast background check.
// Does NOT reload the page.

const QUICK_CHECK_SECONDS =
  30;


// ---------------------------------------------
// STATE
// ---------------------------------------------

let settings = {};

let playlist = {};

let visualItems = [];

let audioItems = [];


let currentVisual =
  0;

let currentAudio =
  0;


let backgroundMusicEnabled =
  false;

let videoMusicBehavior =
  "pause";


let visualTimer =
  null;


let audioUnlocked =
  false;


let quickCheckTimer =
  null;

let fullSyncTimer =
  null;


// Signatures let us know whether
// anything actually changed.

let settingsSignature =
  "";

let playlistSignature =
  "";

let visualSignature =
  "";

let audioSignature =
  "";


// ---------------------------------------------
// START
// ---------------------------------------------

async function startTV() {

  try {

    const fresh =
      await fetchFreshData();


    applyFreshData(
      fresh.settings,
      fresh.playlists,
      true
    );


    startUpdateTimers();

  }

  catch (error) {

    showMessage(
      "Could not load TV display."
    );

  }

}


// ---------------------------------------------
// FETCH STATIC GITHUB PAGES FILES
// ---------------------------------------------

async function fetchJSON(
  filename
) {

  const response =
    await fetch(

      filename +
      "?ts=" +
      Date.now(),

      {
        cache:
          "no-store"
      }

    );


  if (!response.ok) {

    throw new Error(
      "Could not load " +
      filename
    );

  }


  return await
    response.json();

}


async function fetchFreshData() {

  const freshSettings =
    await fetchJSON(
      "settings.json"
    );


  const freshPlaylists =
    await fetchJSON(
      "playlists.json"
    );


  return {

    settings:
      freshSettings,

    playlists:
      freshPlaylists

  };

}


// ---------------------------------------------
// TIMERS
// ---------------------------------------------

function startUpdateTimers() {

  clearInterval(
    quickCheckTimer
  );


  clearInterval(
    fullSyncTimer
  );


  // --------------------------------
  // QUICK CHECK
  // --------------------------------

  quickCheckTimer =
    setInterval(

      () => {

        checkForUpdates(
          false
        );

      },

      QUICK_CHECK_SECONDS *
      1000

    );


  // --------------------------------
  // PERIODIC FULL SYNC
  // --------------------------------

  const minutes =
    settings.refreshMinutes ||
    15;


  fullSyncTimer =
    setInterval(

      () => {

        checkForUpdates(
          true
        );

      },

      minutes *
      60 *
      1000

    );

}


// ---------------------------------------------
// CHECK FOR CHANGES
// ---------------------------------------------

async function checkForUpdates(
  fullSync
) {

  try {

    const fresh =
      await fetchFreshData();


    const newSettingsSignature =
      JSON.stringify(
        fresh.settings
      );


    const newPlaylistSignature =
      JSON.stringify(
        fresh.playlists
      );


    const changed =

      newSettingsSignature !==
        settingsSignature

      ||

      newPlaylistSignature !==
        playlistSignature;


    if (
      changed ||
      fullSync
    ) {

      applyFreshData(

        fresh.settings,

        fresh.playlists,

        false

      );

    }


  }

  catch (error) {

    // --------------------------------
    // SAFETY MECHANISM
    // --------------------------------
    //
    // GitHub unavailable?
    // Wi-Fi hiccup?
    // Bad request?
    //
    // DO NOTHING.
    //
    // Existing slideshow and
    // music continue running.

    console.log(
      "Update check failed. Keeping current display running."
    );

  }

}


// ---------------------------------------------
// APPLY NEW DATA
// ---------------------------------------------

function applyFreshData(

  freshSettings,

  freshPlaylists,

  initialLoad

) {

  const previousMode =
    settings.mode;


  const previousRefresh =
    settings.refreshMinutes;


  const newPlaylist =

    freshPlaylists[

      freshSettings.activePlaylist ||
      "default"

    ] || {};


  const newVisualItems =

    newPlaylist.visualItems ||
    newPlaylist.items ||
    [];


  const newAudioItems =

    newPlaylist.audioItems ||
    [];


  const newVisualSignature =
    JSON.stringify(
      newVisualItems
    );


  const newAudioSignature =
    JSON.stringify({

      items:
        newAudioItems,

      enabled:
        newPlaylist.backgroundMusic?.enabled ||
        false,

      videoBehavior:
        newPlaylist.backgroundMusic?.videoBehavior ||
        "pause"

    });


  const modeChanged =

    previousMode !==
    freshSettings.mode;


  const visualChanged =

    visualSignature !==
    newVisualSignature;


  const audioChanged =

    audioSignature !==
    newAudioSignature;


  // --------------------------------
  // STORE NEW STATE
  // --------------------------------

  settings =
    freshSettings;


  playlist =
    newPlaylist;


  visualItems =
    newVisualItems;


  audioItems =
    newAudioItems;


  backgroundMusicEnabled =
    playlist.backgroundMusic?.enabled ||
    false;


  videoMusicBehavior =
    playlist.backgroundMusic?.videoBehavior ||
    "pause";


  settingsSignature =
    JSON.stringify(
      freshSettings
    );


  playlistSignature =
    JSON.stringify(
      freshPlaylists
    );


  visualSignature =
    newVisualSignature;


  audioSignature =
    newAudioSignature;


  // --------------------------------
  // UPDATE FULL SYNC TIMER
  // IF CONTROL PANEL CHANGED IT
  // --------------------------------

  if (

    previousRefresh !==
      settings.refreshMinutes

    &&

    !initialLoad

  ) {

    startUpdateTimers();

  }


  // =============================================
  // MODE B
  // =============================================

  if (
    settings.mode === "B"
  ) {

    if (

      initialLoad ||
      modeChanged ||
      previousMode !== "B"

    ) {

      stopModeA();

      loadGoogleSlides();

    }

    else {

      // If the Google Slides URL changed,
      // reload only the iframe.

      const iframe =
        document.querySelector(
          "#player iframe"
        );


      if (
        iframe &&
        iframe.src !==
          settings.googleSlidesUrl
      ) {

        loadGoogleSlides();

      }

    }


    return;

  }


  // =============================================
  // MODE A
  // =============================================

  if (
    settings.mode === "A"
  ) {

    // --------------------------------
    // AUDIO
    // --------------------------------

    if (
      backgroundMusicEnabled &&
      audioItems.length
    ) {

      if (
        !audioUnlocked
      ) {

        showAudioButton();

      }

      else if (

        initialLoad ||
        modeChanged ||
        audioChanged

      ) {

        restartAudioPlaylist();

      }

    }

    else {

      stopBackgroundAudio();

      hideAudioButton();

    }


    // --------------------------------
    // VISUAL PLAYLIST
    // --------------------------------

    if (
      !visualItems.length
    ) {

      showMessage(
        "Mode A playlist is empty."
      );

      return;

    }


    if (

      initialLoad ||
      modeChanged ||
      visualChanged

    ) {

      currentVisual =
        0;


      playVisual();

    }

  }

}


// ---------------------------------------------
// MODE B
// ---------------------------------------------

function loadGoogleSlides() {

  hideAudioButton();


  const player =
    document.getElementById(
      "player"
    );


  player.innerHTML =

    `<iframe
      src="${settings.googleSlidesUrl}"
      allow="autoplay"
      allowfullscreen>
    </iframe>`;

}


// ---------------------------------------------
// MODE A VISUALS
// ---------------------------------------------

function playVisual() {

  clearTimeout(
    visualTimer
  );


  if (
    !visualItems.length
  )
    return;


  const item =
    visualItems[
      currentVisual
    ];


  if (
    item.type === "video"
  ) {

    playVideo(
      item
    );

  }

  else {

    playImage(
      item
    );

  }

}


// ---------------------------------------------
// IMAGE
// ---------------------------------------------

function playImage(
  item
) {

  resumeMusicAfterVideo();


  const player =
    document.getElementById(
      "player"
    );


  const image =
    document.createElement(
      "img"
    );


  image.src =

    `${MEDIA_FOLDER}/${encodeURIComponent(item.file)}?ts=${Date.now()}`;


  image.className =
    "visual";


  applyEnterTransition(
    image,
    item.transition
  );


  image.onload =
    () => {

      player.innerHTML =
        "";

      player.appendChild(
        image
      );

    };


  image.onerror =
    nextVisual;


  const duration =

    (
      item.duration ||
      8
    ) *
    1000;


  visualTimer =
    setTimeout(

      () => {

        applyExitTransition(
          image,
          item.transition
        );


        setTimeout(

          nextVisual,

          800

        );

      },

      duration

    );

}


// ---------------------------------------------
// VIDEO
// ---------------------------------------------

function playVideo(
  item
) {

  clearTimeout(
    visualTimer
  );


  const player =
    document.getElementById(
      "player"
    );


  const video =
    document.createElement(
      "video"
    );


  video.src =

    `${MEDIA_FOLDER}/${encodeURIComponent(item.file)}?ts=${Date.now()}`;


  video.autoplay =
    true;


  video.playsInline =
    true;


  video.className =
    "visual";


  applyEnterTransition(
    video,
    item.transition
  );


  // --------------------------------
  // PER-VIDEO MUTE
  // --------------------------------

  if (
    item.muted
  ) {

    video.muted =
      true;

  }


  else if (
    videoMusicBehavior ===
    "pause"
  ) {

    video.muted =
      false;

    pauseBackgroundMusic();

  }


  else if (
    videoMusicBehavior ===
    "continue"
  ) {

    video.muted =
      false;

  }


  else if (
    videoMusicBehavior ===
    "muteVideo"
  ) {

    video.muted =
      true;

  }


  player.innerHTML =
    "";


  player.appendChild(
    video
  );


  function finishVideo() {

    applyExitTransition(
      video,
      item.transition
    );


    setTimeout(

      () => {

        resumeMusicAfterVideo();

        nextVisual();

      },

      800

    );

  }


  if (
    item.videoMode !==
    "custom"
  ) {

    video.onended =
      finishVideo;

  }


  else {

    const duration =

      (
        item.duration ||
        10
      ) *
      1000;


    visualTimer =
      setTimeout(

        () => {

          video.pause();

          finishVideo();

        },

        duration

      );

  }


  video
    .play()
    .catch(
      () => {

        video.muted =
          true;

        video.play();

      }
    );

}


// ---------------------------------------------
// NEXT VISUAL
// ---------------------------------------------

function nextVisual() {

  clearTimeout(
    visualTimer
  );


  if (
    !visualItems.length
  )
    return;


  currentVisual =

    (
      currentVisual +
      1
    ) %
    visualItems.length;


  playVisual();

}


// ---------------------------------------------
// AUDIO START BUTTON
// ---------------------------------------------

document
  .getElementById(
    "audioStartButton"
  )
  .addEventListener(
    "click",
    unlockAudio
  );


function showAudioButton() {

  document.getElementById(
    "audioStart"
  ).style.display =
    "flex";

}


function hideAudioButton() {

  document.getElementById(
    "audioStart"
  ).style.display =
    "none";

}


function unlockAudio() {

  audioUnlocked =
    true;


  hideAudioButton();


  restartAudioPlaylist();

}


// ---------------------------------------------
// AUDIO PLAYLIST
// ---------------------------------------------

function restartAudioPlaylist() {

  if (

    !backgroundMusicEnabled

    ||

    !audioItems.length

    ||

    !audioUnlocked

  )
    return;


  currentAudio =
    0;


  playCurrentAudio();

}


function playCurrentAudio() {

  if (

    !backgroundMusicEnabled

    ||

    !audioItems.length

    ||

    !audioUnlocked

  )
    return;


  const audio =
    document.getElementById(
      "backgroundAudio"
    );


  const track =
    audioItems[
      currentAudio
    ];


  audio.src =

    `${MEDIA_FOLDER}/${encodeURIComponent(track.file)}?ts=${Date.now()}`;


  audio.loop =
    false;


  audio.onended =
    () => {

      currentAudio =

        (
          currentAudio +
          1
        ) %
        audioItems.length;


      playCurrentAudio();

    };


  audio
    .play()
    .catch(
      () => {

        showAudioButton();

      }
    );

}


// ---------------------------------------------
// AUDIO CONTROL
// ---------------------------------------------

function pauseBackgroundMusic() {

  if (
    !backgroundMusicEnabled
  )
    return;


  const audio =
    document.getElementById(
      "backgroundAudio"
    );


  if (
    !audio.paused
  ) {

    audio.pause();


    audio.dataset
      .pausedForVideo =
      "true";

  }

}


function resumeMusicAfterVideo() {

  if (
    !backgroundMusicEnabled
  )
    return;


  const audio =
    document.getElementById(
      "backgroundAudio"
    );


  if (

    audio.dataset
      .pausedForVideo ===
      "true"

  ) {

    delete audio.dataset
      .pausedForVideo;


    if (
      audioUnlocked
    ) {

      audio
        .play()
        .catch(
          () => {

            showAudioButton();

          }
        );

    }

  }

}


function stopBackgroundAudio() {

  const audio =
    document.getElementById(
      "backgroundAudio"
    );


  audio.pause();


  audio.removeAttribute(
    "src"
  );

}


// ---------------------------------------------
// STOP MODE A
// ---------------------------------------------

function stopModeA() {

  clearTimeout(
    visualTimer
  );


  stopBackgroundAudio();


  hideAudioButton();

}


// ---------------------------------------------
// TRANSITIONS
// ---------------------------------------------

function applyEnterTransition(
  element,
  transition
) {

  if (

    !transition

    ||

    transition ===
    "none"

  )
    return;


  element.classList.add(
    `enter-${transition}`
  );

}


function applyExitTransition(
  element,
  transition
) {

  if (

    !transition

    ||

    transition ===
    "none"

  )
    return;


  element.classList.add(
    `exit-${transition}`
  );

}


// ---------------------------------------------
// MESSAGE
// ---------------------------------------------

function showMessage(
  text
) {

  document.getElementById(
    "player"
  ).innerHTML =

    `<div id="message">
      ${text}
    </div>`;

}


// ---------------------------------------------
// GO
// ---------------------------------------------

startTV();

</script>

</body>
</html>
