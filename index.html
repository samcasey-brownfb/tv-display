<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Brown Football TV</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    #slideshow {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }
  </style>
</head>

<body>

<img id="slideshow" src="images/FTF BACKGROUND JP.png">

<script>
  const slides = [
    "images/FTF BACKGROUND JP.png",
    "images/AI IMAGE - LB - FULLY CHARGED 2.0.png",
    "images/Not Afraid 16-9.png"
  ];

  let current = 0;

  setInterval(() => {
    current = (current + 1) % slides.length;
    document.getElementById("slideshow").src = slides[current];
  }, 5000);
</script>

</body>
</html>
