<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Brown Football TV</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    #slideshow {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: black;
    }

    #message {
      color: white;
      font-family: Arial, sans-serif;
      font-size: 3vw;
      text-align: center;
      padding-top: 40vh;
    }
  </style>
</head>

<body>

  <div id="message">Loading TV Display...</div>
  <img id="slideshow" style="display:none;">

  <script>

    const USERNAME = "samcasey-brownfb";
    const REPOSITORY = "tv-display";
    const FOLDER = "images";

    const SLIDE_TIME = 5000;

    async function loadSlides() {

      const apiURL =
        `https://api.github.com/repos/${USERNAME}/${REPOSITORY}/contents/${FOLDER}`;

      try {

        const response = await fetch(apiURL);
        const files = await response.json();

        const slides = files
          .filter(file =>
            /\.(png|jpg|jpeg|webp|gif)$/i.test(file.name)
          )
          .map(file => file.download_url);

        if (slides.length === 0) {
          document.getElementById("message").innerText =
            "No images found.";
          return;
        }

        const image = document.getElementById("slideshow");
        const message = document.getElementById("message");

        message.style.display = "none";
        image.style.display = "block";

        let current = 0;

        image.src = slides[current];

        setInterval(() => {

          current = (current + 1) % slides.length;

          image.src =
            slides[current] + "?refresh=" + Date.now();

        }, SLIDE_TIME);

      }

      catch (error) {

        document.getElementById("message").innerText =
          "Unable to load slideshow.";

        console.error(error);

      }

    }

    loadSlides();

  </script>

</body>
</html>
