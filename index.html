<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Brown Football TV</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    #slideshow {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: black;
    }
  </style>
</head>

<body>

  <img id="slideshow" src="images/slide1.jpg">

  <script>
    const slides = [
      "images/slide1.jpg",
      "images/slide2.jpg",
      "images/slide3.jpg"
    ];

    let currentSlide = 0;

    setInterval(() => {
      currentSlide = (currentSlide + 1) % slides.length;
      document.getElementById("slideshow").src = slides[currentSlide];
    }, 10000);
  </script>

</body>
</html>
