<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brown Football TV</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
}

#player {
  width: 100vw;
  height: 100vh;
  background: black;
  overflow: hidden;
}

.visual {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

iframe {
  width: 100vw;
  height: 100vh;
  border: 0;
}

#message {
  color: white;
  font-family: Arial, sans-serif;
  font-size: 3vw;
  text-align: center;
  padding-top: 40vh;
}

/* FADE */

.enter-fade {
  animation: fadeIn 0.8s ease;
}

.exit-fade {
  animation: fadeOut 0.8s ease forwards;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes fadeOut {
  from { opacity: 1; }
  to { opacity: 0; }
}


/* SLIDE LEFT */

.enter-slideLeft {
  animation: slideLeftIn 0.8s ease;
}

.exit-slideLeft {
  animation: slideLeftOut 0.8s ease forwards;
}

@keyframes slideLeftIn {
  from {
    transform: translateX(100%);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

@keyframes slideLeftOut {
  from {
    transform: translateX(0);
    opacity: 1;
  }
  to {
    transform: translateX(-100%);
    opacity: 0;
  }
}


/* SLIDE RIGHT */

.enter-slideRight {
  animation: slideRightIn 0.8s ease;
}

.exit-slideRight {
  animation: slideRightOut 0.8s ease forwards;
}

@keyframes slideRightIn {
  from {
    transform: translateX(-100%);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

@keyframes slideRightOut {
  from {
    transform: translateX(0);
    opacity: 1;
  }
  to {
    transform: translateX(100%);
    opacity: 0;
  }
}


/* ZOOM IN */

.enter-zoomIn {
  animation: zoomIn 0.8s ease;
}

.exit-zoomIn {
  animation: fadeOut 0.8s ease forwards;
}

@keyframes zoomIn {
  from {
    transform: scale(0.85);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}


/* ZOOM OUT */

.enter-zoomOut {
  animation: zoomOut 0.8s ease;
}

.exit-zoomOut {
  animation: fadeOut 0.8s ease forwards;
}

@keyframes zoomOut {
  from {
    transform: scale(1.15);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}


/* BLUR */

.enter-blur {
  animation: blurIn 0.8s ease;
}

.exit-blur {
  animation: blurOut 0.8s ease forwards;
}

@keyframes blurIn {
  from {
    filter: blur(18px);
    opacity: 0;
  }
  to {
    filter: blur(0);
    opacity: 1;
  }
}

@keyframes blurOut {
  from {
    filter: blur(0);
    opacity: 1;
  }
  to {
    filter: blur(18px);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div id="player">
  <div id="message">
    Loading TV Display...
  </div>
</div>

<audio id="backgroundAudio"></audio>

<script>

const MEDIA_FOLDER = "media";

let settings = {};
let playlist = {};

let visualItems = [];
let audioItems = [];

let currentVisual = 0;
let currentAudio = 0;

let backgroundMusicEnabled = false;
let videoMusicBehavior = "pause";

let visualTimer = null;

async function startTV() {
  try {

    settings =
      await fetch(
        "settings.json?ts=" + Date.now()
      ).then(r => r.json());

    const refreshMinutes =
      settings.refreshMinutes || 15;

    setTimeout(
      () => location.reload(),
      refreshMinutes * 60 * 1000
    );

    if (settings.mode === "B") {
      loadGoogleSlides();
      return;
    }

    if (settings.mode === "A") {
      await loadModeA();
      return;
    }

    showMessage(
      "Unknown display mode."
    );

  } catch (error) {

    showMessage(
      "Could not load TV settings."
    );

  }
}

function loadGoogleSlides() {
  document.getElementById(
    "player"
  ).innerHTML =
    `<iframe
      src="${settings.googleSlidesUrl}"
      allow="autoplay"
      allowfullscreen>
    </iframe>`;
}

async function loadModeA() {
  try {

    const playlists =
      await fetch(
        "playlists.json?ts=" + Date.now()
      ).then(r => r.json());

    playlist =
      playlists[
        settings.activePlaylist ||
        "default"
      ];

    if (!playlist) {
      showMessage(
        "Playlist not found."
      );
      return;
    }

    visualItems =
      playlist.visualItems ||
      playlist.items ||
      [];

    audioItems =
      playlist.audioItems ||
      [];

    backgroundMusicEnabled =
      playlist.backgroundMusic?.enabled ||
      false;

    videoMusicBehavior =
      playlist.backgroundMusic?.videoBehavior ||
      "pause";

    if (
      backgroundMusicEnabled &&
      audioItems.length
    ) {
      startAudioPlaylist();
    }

    if (visualItems.length) {
      playVisual();
    } else {
      showMessage(
        "Mode A playlist is empty."
      );
    }

  } catch (error) {

    showMessage(
      "Could not load Mode A."
    );

  }
}

function playVisual() {
  clearTimeout(
    visualTimer
  );

  const item =
    visualItems[currentVisual];

  if (item.type === "video") {
    playVideo(item);
  } else {
    playImage(item);
  }
}

function playImage(item) {
  resumeMusicAfterVideo();

  const player =
    document.getElementById(
      "player"
    );

  const image =
    document.createElement(
      "img"
    );

  image.src =
    `${MEDIA_FOLDER}/${encodeURIComponent(item.file)}`;

  image.className =
    "visual";

  applyEnterTransition(
    image,
    item.transition
  );

  image.onload =
    () => {
      player.innerHTML = "";
      player.appendChild(image);
    };

  image.onerror =
    nextVisual;

  const duration =
    (item.duration || 8) *
    1000;

  visualTimer =
    setTimeout(
      () => {
        applyExitTransition(
          image,
          item.transition
        );

        setTimeout(
          nextVisual,
          800
        );
      },
      duration
    );
}

function playVideo(item) {
  clearTimeout(
    visualTimer
  );

  const player =
    document.getElementById(
      "player"
    );

  const video =
    document.createElement(
      "video"
    );

  video.src =
    `${MEDIA_FOLDER}/${encodeURIComponent(item.file)}`;

  video.autoplay = true;
  video.playsInline = true;
  video.className = "visual";

  applyEnterTransition(
    video,
    item.transition
  );

  if (
    videoMusicBehavior ===
    "pause"
  ) {
    pauseBackgroundMusic();
    video.muted = false;
  }

  else if (
    videoMusicBehavior ===
    "continue"
  ) {
    video.muted = false;
  }

  else if (
    videoMusicBehavior ===
    "muteVideo"
  ) {
    video.muted = true;
  }

  player.innerHTML = "";
  player.appendChild(video);

  function finishVideo() {
    applyExitTransition(
      video,
      item.transition
    );

    setTimeout(
      () => {
        resumeMusicAfterVideo();
        nextVisual();
      },
      800
    );
  }

  if (
    item.videoMode !==
    "custom"
  ) {
    video.onended =
      finishVideo;
  }

  else {
    const duration =
      (item.duration || 10) *
      1000;

    visualTimer =
      setTimeout(
        () => {
          video.pause();
          finishVideo();
        },
        duration
      );
  }

  const playAttempt =
    video.play();

  if (
    playAttempt !== undefined
  ) {
    playAttempt.catch(
      () => {
        video.muted = true;
        video.play();
      }
    );
  }
}

function applyEnterTransition(
  element,
  transition
) {
  if (
    !transition ||
    transition === "none"
  ) return;

  element.classList.add(
    `enter-${transition}`
  );
}

function applyExitTransition(
  element,
  transition
) {
  if (
    !transition ||
    transition === "none"
  ) return;

  element.classList.add(
    `exit-${transition}`
  );
}

function nextVisual() {
  clearTimeout(
    visualTimer
  );

  currentVisual =
    (
      currentVisual + 1
    ) %
    visualItems.length;

  playVisual();
}

function startAudioPlaylist() {
  if (
    !backgroundMusicEnabled ||
    !audioItems.length
  ) return;

  currentAudio =
    currentAudio %
    audioItems.length;

  playCurrentAudio();
}

function playCurrentAudio() {
  const audio =
    document.getElementById(
      "backgroundAudio"
    );

  const track =
    audioItems[
      currentAudio
    ];

  audio.src =
    `${MEDIA_FOLDER}/${encodeURIComponent(track.file)}`;

  audio.loop = false;

  audio.onended =
    () => {
      currentAudio =
        (
          currentAudio + 1
        ) %
        audioItems.length;

      playCurrentAudio();
    };

  audio.play().catch(
    () => {
      console.log(
        "Background audio autoplay blocked."
      );
    }
  );
}

function pauseBackgroundMusic() {
  if (
    !backgroundMusicEnabled
  ) return;

  const audio =
    document.getElementById(
      "backgroundAudio"
    );

  if (!audio.paused) {
    audio.pause();

    audio.dataset.pausedForVideo =
      "true";
  }
}

function resumeMusicAfterVideo() {
  if (
    !backgroundMusicEnabled
  ) return;

  const audio =
    document.getElementById(
      "backgroundAudio"
    );

  if (
    audio.dataset.pausedForVideo ===
    "true"
  ) {
    delete audio.dataset.pausedForVideo;

    audio.play().catch(
      () => {}
    );
  }
}

function showMessage(text) {
  document.getElementById(
    "player"
  ).innerHTML =
    `<div id="message">
      ${text}
    </div>`;
}

startTV();

</script>

</body>
</html>
