<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Brown Football TV</title>

<style>

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
}

#player {
  position: relative;
  width: 100vw;
  height: 100vh;
  background: black;
  overflow: hidden;
}

.visual {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}


/* GOOGLE SLIDES
   Extra height hides Google's bottom controls.
   Change 55px later if needed.
*/

#slidesFrame {
  position: absolute;
  top: 0;
  left: 0;

  width: 100vw;
  height: calc(100vh + 55px);

  border: 0;
}


#message {
  color: white;
  font-family: Arial, sans-serif;
  font-size: 3vw;
  text-align: center;
  padding-top: 40vh;
}


/* AUDIO START */

#audioStart {
  position: fixed;
  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  background: rgba(0,0,0,.90);

  z-index: 9999;
}

#audioStartContent {
  text-align: center;
  color: white;
  font-family: Arial, sans-serif;
}

#audioStart button {
  padding: 28px 42px;
  font-size: 26px;
  font-weight: bold;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
}

#audioStart p {
  margin-top: 18px;
  color: #ccc;
}


/* FADE */

.enter-fade {
  animation: fadeIn .8s ease;
}

.exit-fade {
  animation: fadeOut .8s ease forwards;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes fadeOut {
  from { opacity: 1; }
  to { opacity: 0; }
}


/* SLIDE LEFT */

.enter-slideLeft {
  animation: slideLeftIn .8s ease;
}

.exit-slideLeft {
  animation: slideLeftOut .8s ease forwards;
}

@keyframes slideLeftIn {

  from {
    transform: translateX(100%);
    opacity: 0;
  }

  to {
    transform: translateX(0);
    opacity: 1;
  }

}

@keyframes slideLeftOut {

  from {
    transform: translateX(0);
    opacity: 1;
  }

  to {
    transform: translateX(-100%);
    opacity: 0;
  }

}


/* SLIDE RIGHT */

.enter-slideRight {
  animation: slideRightIn .8s ease;
}

.exit-slideRight {
  animation: slideRightOut .8s ease forwards;
}

@keyframes slideRightIn {

  from {
    transform: translateX(-100%);
    opacity: 0;
  }

  to {
    transform: translateX(0);
    opacity: 1;
  }

}

@keyframes slideRightOut {

  from {
    transform: translateX(0);
    opacity: 1;
  }

  to {
    transform: translateX(100%);
    opacity: 0;
  }

}


/* ZOOM */

.enter-zoomIn {
  animation: zoomIn .8s ease;
}

.enter-zoomOut {
  animation: zoomOut .8s ease;
}

.exit-zoomIn,
.exit-zoomOut {
  animation: fadeOut .8s ease forwards;
}

@keyframes zoomIn {

  from {
    transform: scale(.85);
    opacity: 0;
  }

  to {
    transform: scale(1);
    opacity: 1;
  }

}

@keyframes zoomOut {

  from {
    transform: scale(1.15);
    opacity: 0;
  }

  to {
    transform: scale(1);
    opacity: 1;
  }

}


/* BLUR */

.enter-blur {
  animation: blurIn .8s ease;
}

.exit-blur {
  animation: blurOut .8s ease forwards;
}

@keyframes blurIn {

  from {
    filter: blur(18px);
    opacity: 0;
  }

  to {
    filter: blur(0);
    opacity: 1;
  }

}

@keyframes blurOut {

  from {
    filter: blur(0);
    opacity: 1;
  }

  to {
    filter: blur(18px);
    opacity: 0;
  }

}

</style>

</head>

<body>


<div id="player">

  <div id="message">
    Loading TV Display...
  </div>

</div>


<audio id="backgroundAudio"></audio>


<div id="audioStart">

  <div id="audioStartContent">

    <button id="audioStartButton">
      START DISPLAY WITH AUDIO
    </button>

    <p>
      Press once to allow background music and/or video sound.
    </p>

  </div>

</div>


<script>


// =================================================
// GITHUB
// =================================================

const OWNER =
  "samcasey-brownfb";

const REPO =
  "tv-display";

const BRANCH =
  "main";

const MEDIA_FOLDER =
  "media";


const RAW_BASE =
  `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;


// TV asks for changes every 30 seconds.

const QUICK_CHECK_SECONDS =
  30;


// =================================================
// STATE
// =================================================

let settings = {};
let playlist = {};

let visualItems = [];
let audioItems = [];

let currentVisual = 0;
let currentAudio = 0;

let modeAMusicEnabled = false;
let modeBMusicEnabled = false;

let videoMusicBehavior =
  "pause";

let visualTimer = null;

let audioUnlocked =
  false;

let quickCheckTimer = null;
let fullSyncTimer = null;

let settingsSignature = "";
let playlistSignature = "";
let visualSignature = "";
let audioSignature = "";


// =================================================
// RAW GITHUB URL HELPERS
// =================================================

function rawFileURL(
  filename
) {

  return (
    RAW_BASE +
    "/" +
    filename +
    "?ts=" +
    Date.now()
  );

}


function rawMediaURL(
  filename
) {

  return (
    RAW_BASE +
    "/" +
    MEDIA_FOLDER +
    "/" +
    encodeURIComponent(filename) +
    "?ts=" +
    Date.now()
  );

}


// =================================================
// START
// =================================================

async function startTV() {

  try {

    const fresh =
      await fetchFreshData();


    applyFreshData(
      fresh.settings,
      fresh.playlists,
      true
    );


    startUpdateTimers();

  }

  catch (error) {

    showMessage(
      "Could not load TV display."
    );

  }

}


// =================================================
// READ DIRECTLY FROM GITHUB REPO
// =================================================

async function fetchRepoJSON(
  filename
) {

  const response =
    await fetch(

      rawFileURL(
        filename
      ),

      {
        cache:
          "no-store"
      }

    );


  if (!response.ok) {

    throw new Error(
      "Could not load " +
      filename
    );

  }


  return await
    response.json();

}


async function fetchFreshData() {

  const results =
    await Promise.all([

      fetchRepoJSON(
        "settings.json"
      ),

      fetchRepoJSON(
        "playlists.json"
      )

    ]);


  return {

    settings:
      results[0],

    playlists:
      results[1]

  };

}


// =================================================
// UPDATE TIMERS
// =================================================

function startUpdateTimers() {

  clearInterval(
    quickCheckTimer
  );


  clearInterval(
    fullSyncTimer
  );


  // ---------------------------------------------
  // QUICK WATCHER
  // ---------------------------------------------

  quickCheckTimer =
    setInterval(

      () =>
        checkForUpdates(
          false
        ),

      QUICK_CHECK_SECONDS *
      1000

    );


  // ---------------------------------------------
  // PERIODIC SAFETY SYNC
  // ---------------------------------------------

  const minutes =
    settings.refreshMinutes ||
    15;


  fullSyncTimer =
    setInterval(

      () =>
        checkForUpdates(
          true
        ),

      minutes *
      60 *
      1000

    );

}


// =================================================
// CHECK FOR UPDATES
// =================================================

async function checkForUpdates(
  fullSync
) {

  try {

    const fresh =
      await fetchFreshData();


    const settingsSig =
      JSON.stringify(
        fresh.settings
      );


    const playlistSig =
      JSON.stringify(
        fresh.playlists
      );


    const changed =

      settingsSig !==
        settingsSignature

      ||

      playlistSig !==
        playlistSignature;


    if (
      changed ||
      fullSync
    ) {

      applyFreshData(

        fresh.settings,

        fresh.playlists,

        false

      );

    }

  }

  catch (error) {

    // =================================================
    // SAFETY MECHANISM
    //
    // If GitHub or Wi-Fi fails,
    // DO NOT destroy the working display.
    // =================================================

    console.log(
      "Update check failed. Current display continues."
    );

  }

}


// =================================================
// MUSIC HELPER
// =================================================

function musicWantedForCurrentMode() {

  if (
    settings.mode === "A"
  ) {

    return (

      modeAMusicEnabled &&

      audioItems.length > 0

    );

  }


  if (
    settings.mode === "B"
  ) {

    return (

      modeBMusicEnabled &&

      audioItems.length > 0

    );

  }


  return false;

}


// =================================================
// MODE A AUDIO REQUIREMENT
// =================================================

function modeAAudioNeeded() {

  if (
    musicWantedForCurrentMode()
  ) {

    return true;

  }


  if (
    videoMusicBehavior ===
    "muteVideo"
  ) {

    return false;

  }


  return visualItems.some(

    item =>
      item.type === "video" &&
      item.muted !== true

  );

}


// =================================================
// APPLY UPDATED SETTINGS
// =================================================

function applyFreshData(

  freshSettings,
  freshPlaylists,
  initialLoad

) {

  const oldMode =
    settings.mode;


  const oldRefresh =
    settings.refreshMinutes;


  const oldSlidesURL =
    settings.googleSlidesUrl;


  const oldModeBMusic =
    modeBMusicEnabled;


  const newPlaylist =

    freshPlaylists[

      freshSettings.activePlaylist ||
      "default"

    ] || {};


  const newVisualItems =

    newPlaylist.visualItems ||
    newPlaylist.items ||
    [];


  const newAudioItems =

    newPlaylist.audioItems ||
    [];


  const newVisualSignature =
    JSON.stringify(
      newVisualItems
    );


  const newAudioSignature =
    JSON.stringify(
      newAudioItems
    );


  const modeChanged =
    oldMode !==
    freshSettings.mode;


  const slidesChanged =
    oldSlidesURL !==
    freshSettings.googleSlidesUrl;


  const visualChanged =
    visualSignature !==
    newVisualSignature;


  const audioChanged =
    audioSignature !==
    newAudioSignature;


  // ---------------------------------------------
  // SAVE NEW STATE
  // ---------------------------------------------

  settings =
    freshSettings;


  playlist =
    newPlaylist;


  visualItems =
    newVisualItems;


  audioItems =
    newAudioItems;


  modeAMusicEnabled =
    playlist.backgroundMusic?.enabled ||
    false;


  modeBMusicEnabled =
    settings.modeBMusicEnabled ||
    false;


  videoMusicBehavior =
    playlist.backgroundMusic?.videoBehavior ||
    "pause";


  settingsSignature =
    JSON.stringify(
      freshSettings
    );


  playlistSignature =
    JSON.stringify(
      freshPlaylists
    );


  visualSignature =
    newVisualSignature;


  audioSignature =
    newAudioSignature;


  // ---------------------------------------------
  // UPDATE SAFETY SYNC TIMER
  // ---------------------------------------------

  if (

    oldRefresh !==
      settings.refreshMinutes

    &&

    !initialLoad

  ) {

    startUpdateTimers();

  }


// =================================================
// MODE B — GOOGLE SLIDES
// =================================================

  if (
    settings.mode === "B"
  ) {

    clearTimeout(
      visualTimer
    );


    const modeBMusicChanged =
      oldModeBMusic !==
      modeBMusicEnabled;


    // ---------------------------------------------
    // ONLY RELOAD GOOGLE SLIDES IF ACTUALLY NEEDED
    // ---------------------------------------------

    if (

      initialLoad ||

      modeChanged ||

      slidesChanged

    ) {

      loadGoogleSlides();

    }


    // ---------------------------------------------
    // MODE B MUSIC
    // ---------------------------------------------

    if (
      musicWantedForCurrentMode()
    ) {

      if (
        !audioUnlocked
      ) {

        stopBackgroundAudio();

        showAudioButton();

      }

      else if (

        initialLoad ||

        modeChanged ||

        audioChanged ||

        modeBMusicChanged

      ) {

        restartAudioPlaylist();

      }

    }

    else {

      stopBackgroundAudio();

      hideAudioButton();

    }


    return;

  }


// =================================================
// MODE A — MEDIA PLAYLIST
// =================================================

  if (
    settings.mode === "A"
  ) {


    if (
      !visualItems.length
    ) {

      showMessage(
        "Mode A playlist is empty."
      );

      return;

    }


    const needsAudio =
      modeAAudioNeeded();


    // ---------------------------------------------
    // AUDIO NEEDS USER PERMISSION
    // ---------------------------------------------

    if (
      needsAudio &&
      !audioUnlocked
    ) {

      clearTimeout(
        visualTimer
      );


      showAudioButton();


      return;

    }


    hideAudioButton();


    // ---------------------------------------------
    // MODE A MUSIC
    // ---------------------------------------------

    if (
      musicWantedForCurrentMode()
    ) {

      if (

        audioUnlocked &&

        (
          initialLoad ||
          modeChanged ||
          audioChanged
        )

      ) {

        restartAudioPlaylist();

      }

    }

    else {

      stopBackgroundAudio();

    }


    // ---------------------------------------------
    // MODE A VISUALS
    // ---------------------------------------------

    if (

      initialLoad ||

      modeChanged ||

      visualChanged

    ) {

      currentVisual =
        0;


      playVisual();

    }

  }

}


// =================================================
// GOOGLE SLIDES
// =================================================

function loadGoogleSlides() {

  const player =
    document.getElementById(
      "player"
    );


  player.innerHTML = `
    <iframe
      id="slidesFrame"
      src="${settings.googleSlidesUrl}"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  `;

}


// =================================================
// MODE A PLAYER
// =================================================

function playVisual() {

  clearTimeout(
    visualTimer
  );


  if (
    !visualItems.length
  )
    return;


  const item =
    visualItems[
      currentVisual
    ];


  if (
    item.type === "video"
  ) {

    playVideo(
      item
    );

  }

  else {

    playImage(
      item
    );

  }

}


// =================================================
// IMAGE
// =================================================

function playImage(item) {

  resumeMusicAfterVideo();


  const player =
    document.getElementById(
      "player"
    );


  const image =
    document.createElement(
      "img"
    );


  // DIRECT FROM GITHUB REPO

  image.src =
    rawMediaURL(
      item.file
    );


  image.className =
    "visual";


  applyEnterTransition(
    image,
    item.transition
  );


  image.onload =
    () => {

      player.innerHTML =
        "";


      player.appendChild(
        image
      );

    };


  image.onerror =
    nextVisual;


  const duration =

    (
      item.duration ||
      8
    ) *
    1000;


  visualTimer =
    setTimeout(

      () => {

        applyExitTransition(
          image,
          item.transition
        );


        setTimeout(

          nextVisual,

          800

        );

      },

      duration

    );

}


// =================================================
// VIDEO
// =================================================

function playVideo(item) {

  clearTimeout(
    visualTimer
  );


  const player =
    document.getElementById(
      "player"
    );


  const video =
    document.createElement(
      "video"
    );


  // DIRECT FROM GITHUB REPO

  video.src =
    rawMediaURL(
      item.file
    );


  video.autoplay =
    true;


  video.playsInline =
    true;


  video.className =
    "visual";


  applyEnterTransition(
    video,
    item.transition
  );


  // ---------------------------------------------
  // SOUND RULES
  // ---------------------------------------------

  if (
    item.muted === true
  ) {

    video.muted =
      true;

  }


  else if (
    videoMusicBehavior ===
    "muteVideo"
  ) {

    video.muted =
      true;

  }


  else if (
    videoMusicBehavior ===
    "pause"
  ) {

    video.muted =
      false;


    pauseBackgroundMusic();

  }


  else {

    video.muted =
      false;

  }


  player.innerHTML =
    "";


  player.appendChild(
    video
  );


  function finishVideo() {

    applyExitTransition(
      video,
      item.transition
    );


    setTimeout(

      () => {

        resumeMusicAfterVideo();


        nextVisual();

      },

      800

    );

  }


  // FULL VIDEO

  if (
    item.videoMode !==
    "custom"
  ) {

    video.onended =
      finishVideo;

  }


  // CUSTOM VIDEO TIME

  else {

    visualTimer =
      setTimeout(

        () => {

          video.pause();


          finishVideo();

        },

        (
          item.duration ||
          10
        ) *
        1000

      );

  }


  video
    .play()
    .catch(

      () => {

        // SAFETY FALLBACK:
        // Play muted rather than freezing.

        video.muted =
          true;


        video.play();

      }

    );

}


// =================================================
// NEXT VISUAL
// =================================================

function nextVisual() {

  clearTimeout(
    visualTimer
  );


  if (
    !visualItems.length
  )
    return;


  currentVisual =

    (
      currentVisual +
      1
    ) %
    visualItems.length;


  playVisual();

}


// =================================================
// AUDIO UNLOCK
// =================================================

document
  .getElementById(
    "audioStartButton"
  )
  .addEventListener(
    "click",
    unlockAudio
  );


function showAudioButton() {

  document
    .getElementById(
      "audioStart"
    )
    .style.display =
      "flex";

}


function hideAudioButton() {

  document
    .getElementById(
      "audioStart"
    )
    .style.display =
      "none";

}


function unlockAudio() {

  audioUnlocked =
    true;


  hideAudioButton();


  if (
    musicWantedForCurrentMode()
  ) {

    restartAudioPlaylist();

  }


  if (
    settings.mode === "A"
  ) {

    currentVisual =
      0;


    playVisual();

  }

}


// =================================================
// AUDIO PLAYLIST
// =================================================

function restartAudioPlaylist() {

  if (

    !musicWantedForCurrentMode()

    ||

    !audioUnlocked

  )
    return;


  currentAudio =
    0;


  playCurrentAudio();

}


function playCurrentAudio() {

  if (

    !musicWantedForCurrentMode()

    ||

    !audioUnlocked

    ||

    !audioItems.length

  )
    return;


  const audio =
    document.getElementById(
      "backgroundAudio"
    );


  const track =
    audioItems[
      currentAudio
    ];


  // DIRECT FROM GITHUB REPO

  audio.src =
    rawMediaURL(
      track.file
    );


  audio.loop =
    false;


  audio.onended =
    () => {

      currentAudio =

        (
          currentAudio +
          1
        ) %
        audioItems.length;


      playCurrentAudio();

    };


  audio
    .play()
    .catch(

      () => {

        showAudioButton();

      }

    );

}


// =================================================
// MUSIC AROUND MODE A VIDEO
// =================================================

function pauseBackgroundMusic() {

  if (
    !musicWantedForCurrentMode()
  )
    return;


  const audio =
    document.getElementById(
      "backgroundAudio"
    );


  if (
    !audio.paused
  ) {

    audio.pause();


    audio.dataset
      .pausedForVideo =
      "true";

  }

}


function resumeMusicAfterVideo() {

  if (
    !musicWantedForCurrentMode()
  )
    return;


  const audio =
    document.getElementById(
      "backgroundAudio"
    );


  if (

    audio.dataset
      .pausedForVideo ===
      "true"

  ) {

    delete audio.dataset
      .pausedForVideo;


    if (
      audioUnlocked
    ) {

      audio
        .play()
        .catch(
          () => {

            showAudioButton();

          }
        );

    }

  }

}


// =================================================
// STOP MUSIC
// =================================================

function stopBackgroundAudio() {

  const audio =
    document.getElementById(
      "backgroundAudio"
    );


  audio.pause();


  audio.removeAttribute(
    "src"
  );

}


// =================================================
// TRANSITIONS
// =================================================

function applyEnterTransition(
  element,
  transition
) {

  if (

    !transition ||

    transition ===
    "none"

  )
    return;


  element.classList.add(
    `enter-${transition}`
  );

}


function applyExitTransition(
  element,
  transition
) {

  if (

    !transition ||

    transition ===
    "none"

  )
    return;


  element.classList.add(
    `exit-${transition}`
  );

}


// =================================================
// MESSAGE
// =================================================

function showMessage(text) {

  document
    .getElementById(
      "player"
    )
    .innerHTML =

      `<div id="message">
        ${text}
      </div>`;

}


// =================================================
// GO
// =================================================

startTV();

</script>

</body>
</html>
