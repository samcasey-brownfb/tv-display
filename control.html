<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brown Football TV Control</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px;
    }

    .card {
      background: #222;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
    }

    button {
      padding: 14px 22px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }

    .mode-buttons {
      display: flex;
      gap: 12px;
    }

    .mode-button {
      flex: 1;
      background: #444;
      color: white;
    }

    .mode-button.active {
      background: #8b1e2d;
    }

    .save-button {
      width: 100%;
      background: #8b1e2d;
      color: white;
      font-size: 20px;
      margin-top: 10px;
    }

    .token-button {
      margin-top: 12px;
    }

    #status {
      margin-top: 15px;
      color: #ccc;
    }

    .small {
      color: #999;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>BROWN FOOTBALL TV</h1>
  <p>Display Control</p>

  <div class="card">
    <h2>GitHub Connection</h2>

    <label>GitHub Token</label>

    <input
      id="token"
      type="password"
      placeholder="Paste token here"
    >

    <button class="token-button" onclick="saveToken()">
      SAVE TOKEN ON THIS COMPUTER
    </button>

    <p class="small">
      Token is stored only in this browser. It is not saved to GitHub.
    </p>
  </div>

  <div class="card">
    <h2>Display Mode</h2>

    <div class="mode-buttons">

      <button id="modeA" class="mode-button" onclick="chooseMode('A')">
        MODE A — MEDIA
      </button>

      <button id="modeB" class="mode-button" onclick="chooseMode('B')">
        MODE B — GOOGLE SLIDES
      </button>

    </div>
  </div>

  <div class="card">

    <h2>Google Slides</h2>

    <label>Published Google Slides URL</label>

    <input
      id="googleSlidesUrl"
      type="text"
      placeholder="Paste published Google Slides URL"
    >

  </div>

  <div class="card">

    <h2>TV Refresh</h2>

    <label>Check for changes every:</label>

    <select id="refreshMinutes">
      <option value="5">5 Minutes</option>
      <option value="10">10 Minutes</option>
      <option value="15">15 Minutes</option>
      <option value="30">30 Minutes</option>
      <option value="60">60 Minutes</option>
    </select>

  </div>

  <button class="save-button" onclick="goLive()">
    SAVE / GO LIVE
  </button>

  <div class="card" style="margin-top:20px;">
    <h2>Status</h2>
    <div id="status">Loading...</div>
  </div>

</div>

<script>

const OWNER = "samcasey-brownfb";
const REPO = "tv-display";
const SETTINGS_FILE = "settings.json";

let settings = {};

function saveToken() {
  const token = document.getElementById("token").value.trim();

  if (!token) {
    alert("Paste your GitHub token first.");
    return;
  }

  localStorage.setItem("tvDisplayGithubToken", token);

  document.getElementById("status").innerText =
    "Token saved on this computer.";
}

function loadSavedToken() {
  const savedToken =
    localStorage.getItem("tvDisplayGithubToken");

  if (savedToken) {
    document.getElementById("token").value = savedToken;
  }
}

async function loadSettings() {

  try {

    const response =
      await fetch("settings.json?ts=" + Date.now());

    settings = await response.json();

    document.getElementById("googleSlidesUrl").value =
      settings.googleSlidesUrl || "";

    document.getElementById("refreshMinutes").value =
      settings.refreshMinutes || 15;

    chooseMode(settings.mode || "B");

    document.getElementById("status").innerText =
      "Current live mode: " + (settings.mode || "B");

  } catch (error) {

    document.getElementById("status").innerText =
      "Could not load settings.";

  }
}

function chooseMode(mode) {

  settings.mode = mode;

  document.getElementById("modeA")
    .classList.toggle("active", mode === "A");

  document.getElementById("modeB")
    .classList.toggle("active", mode === "B");

}

async function goLive() {

  const token =
    localStorage.getItem("tvDisplayGithubToken");

  if (!token) {
    alert("Save your GitHub token first.");
    return;
  }

  document.getElementById("status").innerText =
    "Saving...";

  settings.googleSlidesUrl =
    document.getElementById("googleSlidesUrl").value.trim();

  settings.refreshMinutes =
    Number(document.getElementById("refreshMinutes").value);

  const apiURL =
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${SETTINGS_FILE}`;

  try {

    // Get the current settings.json SHA
    const currentResponse = await fetch(apiURL, {
      headers: {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json"
      }
    });

    if (!currentResponse.ok) {
      throw new Error("Could not read settings.json");
    }

    const currentFile = await currentResponse.json();

    // Convert new settings into Base64
    const jsonText =
      JSON.stringify(settings, null, 2);

    const encodedContent =
      btoa(unescape(encodeURIComponent(jsonText)));

    // Save the new settings.json
    const saveResponse = await fetch(apiURL, {
      method: "PUT",

      headers: {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: "Update TV display settings",
        content: encodedContent,
        sha: currentFile.sha,
        branch: "main"
      })
    });

    if (!saveResponse.ok) {
      const errorInfo = await saveResponse.json();
      throw new Error(errorInfo.message || "Save failed");
    }

    document.getElementById("status").innerText =
      "SAVED — TV settings are now live.";

  } catch (error) {

    document.getElementById("status").innerText =
      "ERROR: " + error.message;

  }
}

loadSavedToken();
loadSettings();

</script>

</body>
</html>
